name: matrices

# The repo ships to Linux, macOS and Windows but its maintainer runs Linux:
# macOS (bash 3.2, BSD tools, case-insensitive APFS) and Windows (PowerShell
# 5.1, CRLF checkouts, USERPROFILE) are exactly where defects went unseen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check.py
        run: python check.py
      - name: check.py self-test
        if: runner.os != 'Windows'
        run: bash tests/check-selftest.sh
      - name: matrices (pwsh)
        run: python tests/run-matrices.py --pwsh pwsh
      - name: matrices (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        run: python tests/run-matrices.py --pwsh powershell
